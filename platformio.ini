[env:stopwatch]
platform = espressif32
; esp32s3box = 16 MB QIO flash + 8 MB octal PSRAM, the same choice as M5Stack's own
; StopWatch PlatformIO instructions.
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; M5GFX 0.3.0 is the first release that autodetects the StopWatch (CO5300 + CST820/CST9217).
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.3.0
    https://github.com/m5stack/M5Unified.git#0.3.0
; The texture lives in flash as part of the app image (memory-mapped through the cache).
board_build.embed_files = data/earth_1024x512.rgb565be
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
; Uploads go through pi4-deck (tools/flash.sh), pinned by serial number. The StopWatch here
; shows up as usb-Espressif_USB_JTAG_serial_debug_unit_C4:9E:7E:12:A8:F8-if00.

; Colour test for the display write paths (see DIAG_COLORS in src/main.cpp).
[env:diag]
extends = env:stopwatch
build_flags = ${env:stopwatch.build_flags} -DDIAG_COLORS
